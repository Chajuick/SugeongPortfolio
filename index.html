<style>
  html, body { margin:0; padding:0; background:#f6f3ec; overflow-x:hidden; }
  body { font-family:'Pretendard','Inter',-apple-system,BlinkMacSystemFont,sans-serif; color:#15110d; -webkit-font-smoothing:antialiased; }
  *, *::before, *::after { box-sizing:border-box; }
  #root { width:100%; min-height:100vh; }
  /* full-bleed: PortfolioWarm sets its own width:100% / height:100%, but we need it to fit the viewport scroll, not its own scroll container */
  #root > [data-pwarm] { height:auto !important; min-height:100vh; overflow-x:hidden !important; overflow-y:visible !important; }

  /* clean ivory scrollbar — matches palette (bg #f6f3ec, line #e7e0d2, accent #c0584a) */
  html { scrollbar-width: thin; scrollbar-color: #d8cfbf transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: #d8cfbf;
    border-radius: 999px;
    border: 2px solid #f6f3ec; /* fakes a slimmer pill on the ivory bg */
    background-clip: padding-box;
    transition: background-color .2s ease;
  }
  ::-webkit-scrollbar-thumb:hover { background: #c0584a; background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
</style>

<body>

  <script type="text/babel">
    const { PortfolioWarm } = window;
    ReactDOM.createRoot(document.getElementById('root')).render(<PortfolioWarm palette="ivoryCoral" />);
  </script>
</body>
